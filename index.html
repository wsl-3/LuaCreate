<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مُولد أكواد روبلوكس المحلي والمزامنة</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --text: #f8fafc;
            --border: #334155;
            --success: #22c55e;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border);
        }
        h2 {
            margin-top: 0;
            color: var(--accent);
            text-align: center;
        }
        .section {
            margin-bottom: 16px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }
        textarea, pre {
            width: 100%;
            box-sizing: border-box;
            background: #0f172a;
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            font-family: monospace;
            font-size: 14px;
        }
        textarea {
            resize: vertical;
            height: 90px;
        }
        button {
            background-color: var(--accent);
            color: #0f172a;
            border: none;
            padding: 10px 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-size: 15px;
            transition: opacity 0.2s;
            margin-top: 8px;
        }
        button:hover {
            opacity: 0.9;
        }
        .btn-folder {
            background-color: #475569;
            color: white;
            margin-bottom: 12px;
        }
        .status {
            font-size: 13px;
            color: var(--success);
            margin-top: 6px;
            text-align: center;
        }
        pre {
            height: 130px;
            overflow-y: auto;
            text-align: left;
            direction: ltr;
            margin-top: 6px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>روبلوكس سينك جنيريتور</h2>
        
        <div class="section">
            <button class="btn-folder" onclick="selectFolder()">📁 اختر مجلد المشروع المحلي</button>
            <div id="folderStatus" class="status">لم يتم اختيار مجلد بعد</div>
        </div>

        <div class="section">
            <label for="ideaInput">اكتب الفكرة أو التعديل:</label>
            <textarea id="ideaInput" placeholder="مثال: ابني بارت أحمر..."></textarea>
            <button onclick="generateAndSave()">توليد وحفظ في الملف المحلي</button>
        </div>

        <div class="section">
            <label for="codeOutput">الكود الناتج:</label>
            <pre id="codeOutput">-- ستظهر النتيجة هنا...</pre>
        </div>
    </div>

    <script>
        let selectedFolderHandle = null;

        async function selectFolder() {
            try {
                // فتح نافذة اختيار المجلد من جهازك
                selectedFolderHandle = await window.showDirectoryPicker();
                document.getElementById('folderStatus').innerText = "تم ربط المجلد بنجاح: " + selectedFolderHandle.name;
            } catch (err) {
                console.error(err);
                document.getElementById('folderStatus').innerText = "تم إلغاء اختيار المجلد.";
            }
        }

        async function generateAndSave() {
            const idea = document.getElementById('ideaInput').value.trim().toLowerCase();
            let luauCode = "";

            if (idea.includes("ابني") || idea.includes("سوي بارت") || idea.includes("part")) {
                luauCode = `-- Generated by Local Generator\n` +
                           `local part = Instance.new("Part")\n` +
                           `part.Size = Vector3.new(4, 1, 4)\n` +
                           `part.Position = Vector3.new(0, 5, 0)\n` +
                           `part.Anchored = true\n` +
                           `part.BrickColor = BrickColor.new("Bright red")\n` +
                           `part.Parent = workspace\n` +
                           `print("تم بناء البارت بنجاح!")`;
            } else if (idea.includes("اطبع") || idea.includes("رسالة") || idea.includes("print")) {
                luauCode = `-- Generated by Local Generator\n` +
                           `print("أهلاً بك في لعبة روبلوكس - تم التحديث بواسطة الجينيريتور المحلي!")`;
            } else if (idea === "") {
                luauCode = "-- الرجاء إدخال فكرة صحيحة أولاً.";
            } else {
                luauCode = `-- Generated for idea: ${idea}\n` +
                           `print("الفكرة الواردة: ${idea}")`;
            }

            document.getElementById('codeOutput').innerText = luauCode;

            // حفظ الملف تلقائياً في المجلد المحدد إذا تم ربطه
            if (selectedFolderHandle) {
                try {
                    // إنشاء أو فتح ملف باسم generated_script.lua داخل المجلد
                    const fileHandle = await selectedFolderHandle.getFileHandle("generated_script.lua", { create: true });
                    const writable = await fileHandle.createWritable();
                    await writable.write(luauCode);
                    await writable.close();
                    document.getElementById('folderStatus').innerText = "✅ تم تحديث وحفظ الملف في المجلد المحلي بنجاح!";
                } catch (err) {
                    console.error(err);
                    alert("حدث خطأ أثناء حفظ الملف، تأكد من منح الصلاحيات.");
                }
            } else {
                alert("الرجاء اختيار المجلد المحلي أولاً قبل التوليد لكي يتم الحفظ تلقائياً.");
            }
        }
    </script>
</body>
</html>
