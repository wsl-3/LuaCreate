<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مُولد أكواد روبلوكس المحلي</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --text: #f8fafc;
            --border: #334155;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border);
        }
        h2 {
            margin-top: 0;
            color: var(--accent);
            text-align: center;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }
        textarea, pre {
            width: 100%;
            box-sizing: border-box;
            background: #0f172a;
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            font-family: monospace;
            font-size: 14px;
        }
        textarea {
            resize: vertical;
            height: 100px;
            margin-bottom: 16px;
        }
        button {
            background-color: var(--accent);
            color: #0f172a;
            border: none;
            padding: 10px 20px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            transition: opacity 0.2s;
        }
        button:hover {
            opacity: 0.9;
        }
        .output-box {
            margin-top: 20px;
        }
        pre {
            height: 150px;
            overflow-y: auto;
            text-align: left;
            direction: ltr;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>مُولد أكواد روبلوكس</h2>
        <label for="ideaInput">اكتب الفكرة أو التعديل:</label>
        <textarea id="ideaInput" placeholder="مثال: ابني بارت أحمر أو اطبع رسالة ترحيبية..."></textarea>
        
        <button onclick="generateCode()">توليد كود Luau</button>

        <div class="output-box">
            <label for="codeOutput">الكود الناتج:</label>
            <pre id="codeOutput">-- ستظهر النتيجة هنا بعد كتابة الفكرة...</pre>
        </div>
    </div>

    <script>
        function generateCode() {
            const idea = document.getElementById('ideaInput').value.trim().toLowerCase();
            let luauCode = "";

            if (idea.includes("ابني") || idea.includes("سوي بارت") || idea.includes("part")) {
                luauCode = `-- Generated by Local Generator\n` +
                           `local part = Instance.new("Part")\n` +
                           `part.Size = Vector3.new(4, 1, 4)\n` +
                           `part.Position = Vector3.new(0, 5, 0)\n` +
                           `part.Anchored = true\n` +
                           `part.BrickColor = BrickColor.new("Bright red")\n` +
                           `part.Parent = workspace\n` +
                           `print("تم بناء البارت بنجاح!")`;
            } else if (idea.includes("اطبع") || idea.includes("رسالة") || idea.includes("print")) {
                luauCode = `-- Generated by Local Generator\n` +
                           `print("أهلاً بك في لعبة روبلوكس - تم التحديث بواسطة الجينيريتور المحلي!")`;
            } else if (idea === "") {
                luauCode = "-- الرجاء إدخال فكرة صحيحة أولاً.";
            } else {
                luauCode = `-- Generated for idea: ${idea}\n` +
                           `-- [ملاحظة]: لم يتم التعرف على قاعدة مخصصة، تمت إضافة قالب افتراضي.\n` +
                           `print("الفكرة الواردة: ${idea}")`;
            }

            document.getElementById('codeOutput').innerText = luauCode;
        }
    </script>
</body>
</html>
